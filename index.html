<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grand Line Arena</title>
<style>
:root{--navy:#071426;--navy2:#102a48;--gold:#f7c84b;--cyan:#75d6e8;--ink:#07111f;--cream:#fff8df}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#1b5277 0,#0c2341 36%,#071426 100%);color:#fff;font-family:Trebuchet MS,Arial,sans-serif;min-height:100vh}.shell{max-width:1240px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:20px;font-weight:900}.brand b{color:var(--gold)}.berries{border:1px solid #ffffff22;border-radius:999px;background:#07142680;padding:9px 14px}.nav{display:flex;gap:8px;margin-bottom:22px}.nav button{border:1px solid #ffffff1c;background:#ffffff10;color:#dbeaff;border-radius:999px;padding:10px 22px;font-weight:800;cursor:pointer}.nav button.active{color:#152036;background:var(--gold);border-color:#ffe99a}.view{display:none}.view.active{display:block}.battle-grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px}.title{font-size:28px;margin:5px 0 18px}.fighters{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.fighter{height:220px;border:1px solid #ffffff18;border-radius:13px;overflow:hidden;background:#102845;cursor:pointer;position:relative;transition:.18s}.fighter:hover{transform:translateY(-4px);border-color:#ffffff55}.fighter.selected{outline:3px solid var(--gold);outline-offset:-3px}.portrait{height:154px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}.portrait:after{content:"";position:absolute;inset:auto -20% -60% -20%;height:75%;border-radius:50%;background:#ffffff12}.avatar{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;font-size:68px;z-index:1;filter:drop-shadow(0 12px 8px #0006)}.lock{position:absolute;left:14px;bottom:8px;font-size:11px;font-weight:900;color:#dce8f7}.info{height:66px;padding:11px 14px;background:#17304f}.info h3{font-size:17px;margin:0 0 5px}.role{color:var(--gold);font-size:12px}.side{height:max-content;border:1px solid #ffffff16;border-radius:13px;background:#102542;padding:18px}.side h2{margin:0 0 13px}.side select{width:100%;padding:12px;border:0;border-radius:8px}.enemy{color:#b6c5d8;min-height:38px}.start{width:100%;border:0;border-radius:8px;padding:13px;background:var(--gold);color:#18243a;font-weight:900;cursor:pointer}.start:disabled{background:#4b5d72;color:#98a6b5}.crewform{display:flex;gap:10px;background:#102542;border-radius:12px;padding:16px}.crewform input{flex:1;border:1px solid #ffffff18;border-radius8px;background:#09172a;color:#fff;padding:12px}.crewform button{border:0;border-radius:8px;background:var(--gold);font-weight:900;padding:12px 20px}.crewgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px}.crewcard{background:#102542;border:1px solid #ffffff16;border-radius:12px;text-align:center;padding:25px}.crewicon{font-size:58px}.maptools{display:flex;justify-content:space-between;align-items:center}.maptools button{width:auto}.map{height:520px;margin-top:16px;border:1px solid #ffffff18;border-radius:16px;position:relative;overflow:hidden;background:linear-gradient(#79c8dc 0 35%,#1b91aa 36% 100%)}.cloud{position:absolute;width:170px;height:48px;border-radius:50%;background:#ffffff55;filter:blur(2px)}.island{position:absolute;width:210px;height:125px;border-radius:50%;background:#edcf88;border:10px solid #4f9e67;display:grid;place-items:center;cursor:pointer;box-shadow:0 16px 20px #06384d55}.island b{color:#20455a}.island.one{left:7%;bottom:25%}.island.two{right:8%;top:18%}.island.three{left:43%;bottom:8%}.ship{position:absolute;left:43%;bottom:34%;font-size:72px;z-index:3;filter:drop-shadow(0 12px 8px #0007);transition:.8s}.arena{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:#06101cdc;padding:20px}.arena.open{display:flex}.arenabox{width:min(900px,100%);background:#0c1c31;border:1px solid #ffffff22;border-radius:14px;padding:16px}.arenahead{display:flex;justify-content:space-between;align-items:center}.arenahead button{border:1px solid #ffffff22;background:#ffffff10;color:#fff;padding:8px 12px;border-radius8px}.stage{height:330px;position:relative;border-radius:12px;overflow:hidden;background:linear-gradient(#68bed1 0 58%,#b89961 59%)}.fighterbox{position:absolute;bottom:24px;width:260px;text-align:center}.fighterbox.left{left:4%}.fighterbox.right{right:4%}.fighteremoji{font-size:100px}.health{height:14px;border:1px solid #ffffff55;border-radius:20px;background:#0007;overflow:hidden}.health i{display:block;height:100%;width:100%;background:#67ce8c;transition:.3s}.enemyhealth i{background:#ed6c79}.log{height:110px;overflow:auto;margin-top:12px;border-radius8px;background:#07111f;padding:9px;font-size13px}.log div{padding:3px}.toast{position:fixed;right:20px;bottom:20px;padding:13px 18px;background:#fff;color:#17253a;border-radius8px;opacity:0;transform:translateY(30px);transition:.25s}.toast.show{opacity:1;transform:none}@media(max-width:850px){.battle-grid{grid-template-columns:1fr}.fighters{grid-template-columns:repeat(2,1fr)}.crewgrid{grid-template-columns:repeat(2,1fr)}.map{height:420px}}@media(max-width:500px){.fighters{grid-template-columns:1fr}.fighter{height:210px}.crewgrid{grid-template-columns:1fr}.crewform{flex-direction:column}.island{width:150px;height:95px}.island.two{right:2%}.fighterbox{width:160px}.fighteremoji{font-size:72px}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><div class="brand">GRAND LINE <b>ARENA</b></div><div class="berries">Berries <b id="berries">10,000</b></div></header>
<nav class="nav"><button class="active" data-view="battle">Battle</button><button data-view="crew">Crew</button><button data-view="explore">Explore</button></nav>
<main id="battle" class="view active"><div class="battle-grid"><section><h1 class="title">Choose exactly two fighters</h1><div id="fighters" class="fighters"></div></section><aside class="side"><h2>Faction</h2><select id="faction"><option>Pirates</option><option>Marines</option><option>Revolutionaries</option></select><p class="enemy" id="enemy">Enemy faction: Marines</p><button id="start" class="start" disabled>START BATTLE</button></aside></div></main>
<main id="crew" class="view"><h1 class="title">Your Crew</h1><div class="crewform"><input id="crewName" value="Straw Hat Fellowship"><input id="memberName" placeholder="New crew member name"><button id="recruit">Recruit</button></div><div id="crewgrid" class="crewgrid"></div></main>
<main id="explore" class="view"><h1 class="title">Sea Exploration</h1><div class="maptools"><b>Ship: <span id="shipName">Voyager</span></b><button id="unlock" class="start" style="width:auto">UNLOCK SHIP · 5,000</button></div><div class="map"><div class="cloud" style="left:12%;top:10%"></div><div class="cloud" style="right:12%;top:8%"></div><div class="island one" data-place="Loguetown"><b>Loguetown</b></div><div class="island two" data-place="Drum Island"><b>Drum Island</b></div><div class="island three" data-place="Marineford"><b>Marineford</b></div><div id="ship" class="ship">⛵</div></div></main>
</div>
<div id="arena" class="arena"><div class="arenabox"><div class="arenahead"><h2>Battle Simulation</h2><button id="close">Close</button></div><div class="stage"><div class="fighterbox left"><div id="leftEmoji" class="fighteremoji">🏴‍☠️</div><div id="leftName"></div><div class="health"><i id="leftHealth"></i></div></div><div class="fighterbox right"><div id="rightEmoji" class="fighteremoji">⚔️</div><div id="rightName">Marine Captain</div><div class="health enemyhealth"><i id="rightHealth"></i></div></div></div><div id="log" class="log"></div></div></div>
<div id="toast" class="toast"></div>
<script>
const chars=[['Monkey D. Luffy','🏴‍☠️','Rubber','#71303d','#dc4d5a'],['Roronoa Zoro','⚔️','Swordsman','#153c43','#1e8b86'],['Nami','🧭','Navigator','#594b6c','#d8a04a'],['Sanji','👞','Cook','#6f4b3b','#d0a46c'],['Sabo','🔥','Revolutionary','#70412a','#dc6540'],['Smoker','🚬','Marine','#56645f','#abb2a5'],['Nico Robin','🌸','Archaeologist','#4c3b70','#a178ba'],['Franky','🤖','Shipwright','#245c70','#49a1a5'],['Portgas D. Ace','🔥','Pirate','#733129','#ed8c3d']];
let selected=[],berries=10000,crew=[];
const grid=document.querySelector('#fighters');
chars.forEach((c,i)=>{const card=document.createElement('article');card.className='fighter';card.innerHTML=`<div class="portrait" style="background:linear-gradient(145deg,${c[3]},${c[4]})"><div class="avatar">${c[1]}</div><span class="lock">ALL UNLOCKED</span></div><div class="info"><h3>${c[0]}</h3><span class="role">${c[2]}</span></div>`;card.onclick=()=>toggle(card,i);grid.appendChild(card)});
function toggle(card,i){if(selected.includes(i)){selected=selected.filter(x=>x!==i);card.classList.remove('selected')}else if(selected.length<2){selected.push(i);card.classList.add('selected')}else toast('Choose exactly two fighters');document.querySelector('#start').disabled=selected.length!==2}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.querySelector('#'+b.dataset.view).classList.add('active')});
function toast(t){const el=document.querySelector('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}
document.querySelector('#faction').onchange=e=>{const enemy={Pirates:'Marines',Marines:'Pirates',Revolutionaries:'World Government'};document.querySelector('#enemy').textContent='Enemy faction: '+enemy[e.target.value]};
const arena=document.querySelector('#arena');document.querySelector('#close').onclick=()=>arena.classList.remove('open');
document.querySelector('#start').onclick=()=>{const a=chars[selected[0]],b=chars[selected[1]];document.querySelector('#leftEmoji').textContent=a[1];document.querySelector('#leftName').textContent=a[0]+' + '+b[0];document.querySelector('#rightEmoji').textContent=document.querySelector('#faction').value==='Marines'?'🏴‍☠️':'⚔️';document.querySelector('#rightName').textContent=document.querySelector('#faction').value==='Pirates'?'Marine Captain':document.querySelector('#faction').value==='Marines'?'Pirate Captain':'Government Agent';document.querySelector('#leftHealth').style.width='100%';document.querySelector('#rightHealth').style.width='100%';document.querySelector('#log').innerHTML='';arena.classList.add('open');battle()};
function battle(){let hp=100,enemy=100;const log=document.querySelector('#log');const add=t=>{log.insertAdjacentHTML('beforeend','<div>'+t+'</div>');log.scrollTop=log.scrollHeight};add('The battle begins!');const timer=setInterval(()=>{if(enemy>0){enemy=Math.max(0,enemy-12-Math.floor(Math.random()*18));document.querySelector('#rightHealth').style.width=enemy+'%';add(chars[selected[Math.floor(Math.random()*2)]][0]+' landed a powerful attack!')}if(hp>0&&enemy>0){hp=Math.max(0,hp-8-Math.floor(Math.random()*14));document.querySelector('#leftHealth').style.width=hp+'%';add('The enemy counterattacked!')}if(hp<=0||enemy<=0){clearInterval(timer);if(enemy<=0){berries+=1500;document.querySelector('#berries').textContent=berries.toLocaleString();add('VICTORY — 1,500 berries earned!')}else add('Defeat — regroup and try again!')}},650)}
function renderCrew(){document.querySelector('#crewgrid').innerHTML=crew.map((n,i)=>`<article class="crewcard"><div class="crewicon">🧑‍✈️</div><b>${n}</b><div>Crew member ${i+1}</div></article>`).join('')}
document.querySelector('#recruit').onclick=()=>{const el=document.querySelector('#memberName'),n=el.value.trim();if(!n)return toast('Enter a crew member name');crew.push(n);el.value='';renderCrew();toast(n+' joined the crew')};
document.querySelector('#unlock').onclick=()=>{if(berries<5000)return toast('Need 5,000 berries');berries-=5000;document.querySelector('#berries').textContent=berries.toLocaleString();document.querySelector('#shipName').textContent='Grand Voyager';toast('Grand Voyager unlocked')};
document.querySelectorAll('.island').forEach((island,i)=>island.onclick=()=>{const places=[['15%','65%'],['70%','28%'],['43%','55%']];document.querySelector('#ship').style.left=places[i][0];document.querySelector('#ship').style.bottom=places[i][1];toast('Arrived at '+island.dataset.place)});
renderCrew();
</script>
</body>
</html>
