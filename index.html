<!doctype>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grand Line: Crew Conquest</title>
<style>
:root{--navy:#081426;--gold:#f6c85f;--red:#e84a5f;--sea:#38a9c5}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#07111f,#102b43);color:#fff;font-family:system-ui,-apple-system,sans-serif}header{height:74px;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff18}h1{font-size:22px;margin:0}.gold{color:var(--gold)}main{max-width:1100px;margin:auto;padding:24px}.tabs{display:flex;gap:8px;margin-bottom:18px}.tab{border:1px solid #ffffff25;background:#ffffff0d;color:white;padding:10px 16px;border-radius:20px;cursor:pointer}.tab.active{background:var(--gold);color:#171717}.panel{display:none}.panel.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}.card{position:relative;border:1px solid #ffffff20;border-radius:14px;padding:14px;background:#ffffff09;cursor:pointer;overflow:hidden}.card.selected{border:2px solid var(--gold);box-shadow:0 0 18px #f6c85f55}.portrait{height:125px;border-radius:10px;display:flex;align-items:flex-end;padding:10px;font-size:28px;font-weight:900;text-shadow:2px 2px #000;background:linear-gradient(160deg,#315,#18243e)}.card h3{margin:10px 0 4px}.badge{font-size:12px;color:var(--gold)}.primary{border:0;border-radius:10px;background:var(--red);color:white;font-weight:800;padding:14px 18px;cursor:pointer}.primary:disabled{filter:grayscale(1);opacity:.5}.battlebar{display:flex;justify-content:space-between;align-items:center;margin:16px 0}.arena{min-height:330px;border-radius:16px;border:1px solid #ffffff20;background:radial-gradient(circle at 50% 90%,#d7b46a55 0 10%,transparent 11%),linear-gradient(#5bb5cf 0 58%,#80633a 59%);position:relative;overflow:hidden}.fighter{position:absolute;bottom:35px;width:180px;text-align:center}.fighter.one{left:9%}.fighter.two{right:9%}.sprite{font-size:76px;filter:drop-shadow(4px 7px 2px #0008)}.health{height:12px;border-radius:8px;background:#0006;border:1px solid #fff6}.health i{height:100%;display:block;background:#58ca75;border-radius:8px;transition:.25s}.vs{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:48px;font-weight:1000}.log{height:95px;overflow:auto;background:#06101e;border:1px solid #ffffff15;border-radius:10px;padding:10px;margin-top:12px;font-size:14px}.field{display:flex;gap:10px}.field input{flex:1;border:1px solid #ffffff25;border-radius:8px;background:#ffffff0c;color:white;padding:12px}.crewbox{padding:18px;border:1px solid #ffffff20;border-radius:14px;background:#ffffff08}.ship{font-size:130px;text-align:center;margin:18px;filter:drop-shadow(0 12px 10px #0008)}.map{height:320px;border:1px solid #ffffff20;border-radius:16px;background:linear-gradient(#75c9dd 0 45%,#247fa2 46% 100%);position:relative;overflow:hidden}.island{position:absolute;border-radius:50%;background:#d7b46a;border:5px solid #5d9a63}.island i{position:absolute;font-style:normal;font-size:12px;font-weight:bold;color:#183244}.is1{width:150px;height:90px;left:8%;top:35%}.is2{width:190px;height:110px;right:8%;top:20%}.is3{width:120px;height:75px;left:43%;bottom:8%}.ship-pin{position:absolute;font-size:38px;left:45%;top:48%;transition:.7s}.toast{position:fixed;right:20px;bottom:20px;background:#162238;border-left:4px solid var(--gold);padding:14px;border-radius:8px;display:none}.row{display:flex;gap:12px}.stats{margin-left:auto;color:#b9cae0}.stat{display:inline-block;margin-left:14px}@media(max-width:700px){.row{flex-direction:column}.fighter{width:140px}.fighter.one{left:3%}.fighter.two{right:3%}.stats{margin:0}}
</style></head>
<body><header><h1>GRAND LINE <span class="gold">CONQUEST</span></h1><div class="stats">Berries <b id="berries">10000</b> <span class="stat">Crew <b id="crewcount">0</b></span></div></header>
<main><div class="tabs"><button class="tab active" data-tab="fight">Battle</button><button class="tab" data-tab="crew">Crew</button><button class="tab" data-tab="explore">Explore</button></div>
<section id="fight" class="panel active"><div class="row"><div style="flex:1"><h2>Choose exactly two fighters</h2><div id="fighters" class="grid"></div></div><aside style="width:250px" class="crewbox"><h3>Faction</h3><select id="faction" style="width:100%;padding:10px"><option>Pirates</option><option>Marines</option><option>Revolutionaries</option></select><p id="enemyInfo"></p><button id="start" class="primary" style="width:100%" disabled>START BATTLE</button></aside></div></section>
<section id="crew" class="panel"><h2>Your Crew</h2><div class="crewbox"><div class="field"><input id="crewName" placeholder="Crew name" value="Straw Hat Fellowship"><input id="memberName" placeholder="Recruit name"><button id="addMember" class="primary">Recruit</button></div><h3 id="crewTitle"></h3><div id="members" class="grid"></div></div></section>
<section id="explore" class="panel"><h2>Sea Exploration</h2><div class="battlebar"><div><b>Ship:</b> <span id="shipName">Voyager</span></div><div><button class="primary" id="newShip">Unlock Ship (5000 berries)</button></div></div><div class="map"><div class="island is1"><i>Loguetown</i></div><div class="island is2"><i>Drum Island</i></div><div class="island is3"><i>Marineford</i></div><div id="shipPin" class="ship-pin">⛵</div></div></section>
</main><dialog id="battleDialog"><div style="background:#0c1a2d;color:white;border:1px solid #ffffff30;border-radius:16px;padding:18px;max-width:800px"><div class="battlebar"><h2>Battle Simulation</h2><button id="close" class="tab">Close</button></div><div class="arena"><div class="fighter one"><div id="pSprite" class="sprite">🏴‍☠️</div><div id="pName"></div><div class="health"><i id="pHealth"></i></div></div><div class="vs">VS</div><div class="fighter two"><div id="eSprite" class="sprite">⚔️</div><div id="eName"></div><div class="health"><i id="eHealth"></i></div></div></div><div class="log" id="log"></div></div></dialog><div id="toast" class="toast"></div>
<script>
const chars=[['Monkey D. Luffy','🏴‍☠️','Rubber'],['Roronoa Zoro','⚔️','Swordsman'],['Nami','🧭','Navigator'],['Sanji','👞','Cook'],['Sabo','🔥','Revolutionary'],['Smoker','🚬','Marine'],['Akainu','🌋','Marine Admiral'],['Kizaru','💡','Marine Admiral'],['Aokiji','❄️','Marine Admiral'],['Buggy','🤡','Pirate'],['Nico Robin','🌸','Archaeologist'],['Franky','🤖','Shipwright']];
let selected=[],crew=[],berries=10000;
const fighters=document.querySelector('#fighters');chars.forEach((c,i)=>{let d=document.createElement('div');d.className='card';d.innerHTML=`<div class="portrait">${c[1]}<span style="margin-left:auto">UNLOCKED</span></div><h3>${c[0]}</h3><span class="badge">${c[2]}</span>`;d.onclick=()=>toggle(d,i);fighters.appendChild(d)});
function toggle(el,i){if(selected.includes(i)){selected=selected.filter(x=>x!==i);el.classList.remove('selected')}else if(selected.length<2){selected.push(i);el.classList.add('selected')}else return;document.query('#start')?.setAttribute('disabled','') ;document.querySelector('#start').disabled=selected.length!==2}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.query('#'+t.dataset.tab).classList.add('active')});
const dlg=document.querySelector('#battleDialog');document.querySelector('#start').onclick=()=>{if(selected.length!==2)return;document.querySelector('#pName').textContent=chars[selected[0]][0]+' + '+chars[selected[1]][0];document.querySelector('#pSprite').textContent=chars[selected[0]][1];let faction=document.query('#faction').value;let enemy=faction==='Pirates'?['Sengoku','Kizaru','Akainu','Smoker']: ['Luffy','Zoro','Shanks','Buggy'];let name=enemy[Math.floor(Math.random()*enemy.length)];document.query('#eName').textContent=name;document.query('#log').innerHTML='';document.query('#pHealth').style.width='100%';document.query('#eHealth').style.width='100%';dlg.showModal();battle(faction,name)};
document.query('#close').onclick=()=>dlg.close();
function battle(faction,name){let hp=[100,100],turn=0;let moves=['finisher','heavy strike','speed combo','special attack','counter'];let timer=setInterval(()=>{turn++;let a=selected[turn%2],side=turn%2;if(side===0){let dmg=13+Math.floor(Math.random()*22);hp[1]-=dmg;document.query('#eHealth').style.width=Math.max(0,hp[1])+'%';addlog(chars[a][0]+' used '+moves[Math.floor(Math.random()*moves.length)]+'! '+dmg+' damage.')}else{let dmg=10+Math.floor(Math.random()*18);hp[0]-=dmg;document.query('#pHealth').style.width=Math.max(0,hp[0])+'%';addlog(name+' attacked! '+dmg+' damage.')}if(hp[0]<=0||hp[1]<=0){clearInterval(timer);if(hp[1]<=0){berries+=1500;document.query('#berries').textContent=berries;addlog('VICTORY! Bounty gained: 1,500 berries')}else addlog('Defeat — regroup and try again!')}},650)}
function addlog(s){let l=document.query('#log');l.innerHTML+='<div>'+s+'</div>';l.scrollTop=l.scrollHeight}
function addCrew(){let n=document.query('#memberName').value.trim();if(!n)return toast('Enter a member name');crew.push(n);document.query('#memberName').value='';renderCrew()}
function renderCrew(){document.query('#crewTitle').textContent=document.query('#crewName').value||'Unnamed Crew';let m=document.query('#members');m.innerHTML=crew.map((n,i)=>`<div class="card"><div class="portrait">🧑‍✈️</div><h3>${n}</h3><span class="badge">Crew Member ${i+1}</span></div>`).join('');document.query('#crewcount').textContent=crew.length}
document.query('#addMember').onclick=addCrew;document.query('#crewName').oninput=renderCrew;
document.query('#newShip').onclick=()=>{if(berries<5000)return toast('Need 5,000 berries');berries-=5000;document.query('#berries').textContent=berries;document.query('#shipName').textContent='Grand Voyager';toast('Ship unlocked: Grand Voyager')};
for(let i=0;i<6;i++)document.query('#members').appendChild=document.createElement('div');
document.queryAll=document.query.bind(document);document.query='#'+[''].join==='x'?document.querySelector:document.querySelector;
document.query('#faction').onchange=()=>{let f=document.query('#faction').value;document.query('#enemyInfo').textContent=f==='Pirates'?'Enemy faction: Marines':f==='Marines'?'Enemy faction: Pirates':'Enemy faction: Marines'};renderCrew();
</script></body></html>
