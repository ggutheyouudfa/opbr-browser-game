<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grand Line Arena</title>
<style>
:root{--navy:#071426;--gold:#f7c84b;--red:#ed6c79;--green:#67c88c}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#fff;font-family:Trebuchet MS,Arial,sans-serif;background:radial-gradient(circle at 50% -20%,#1b5277,#0c2341 36%,#071426 100%)}button{font:inherit}.shell{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-size:24px;font-weight:900}.brand b{color:var(--gold)}.berries{border:1px solid #ffffff22;border-radius:999px;background:#07142680;padding:9px 14px}.battle-grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px}.title{font-size:28px;margin:4px 0 18px}.fighters{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.fighter{height:240px;border:1px solid #ffffff18;border-radius:13px;overflow:hidden;background:#102845;cursor:pointer;transition:.18s}.fighter:hover{transform:translateY(-4px);border-color:#ffffff70}.fighter.selected{outline:3px solid var(--gold);outline-offset:-3px}.portrait{height:174px;display:grid;place-items:end center;position:relative;overflow:hidden}.fighter-art{width:100%;height:100%;display:block;filter:drop-shadow(0 10px 6px #0005)}.portrait .fighter-art{width:150px;height:174px}.info{height:66px;padding:11px 14px;background:#17304f}.info h3{font-size:17px;margin:0 0 5px}.role{color:var(--gold);font-size:12px}.side{height:max-content;border:1px solid #ffffff16;border-radius:13px;background:#102542;padding:18px}.side h2{margin:0 0 13px}.side select{width:100%;padding:12px;border:0;border-radius:8px}.enemy{color:#b6c5d8}.start{width:100%;border:0;border-radius:8px;padding:13px;background:var(--gold);color:#18243a;font-weight:900;cursor:pointer}.start:disabled{background:#4b5d72;color:#98a6b5}
.arena{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:#06101cdd;padding:20px}.arena.open{display:flex}.arenabox{width:min(900px,100%);background:#0c1c31;border:1px solid #ffffff22;border-radius:14px;padding:16px}.arenahead{display:flex;justify-content:space-between;align-items:center}.arenahead h2{margin:0}.arenahead button{border:1px solid #ffffff22;background:#ffffff10;color:#fff;padding:8px 12px;border-radius:8px;cursor:pointer}.stage{height:390px;position:relative;overflow:hidden;border-radius:12px;background:linear-gradient(#56a9d0 0 55%,#c7a86c 56%)}.stage:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 88%,#ffe8a044,transparent 58%),linear-gradient(0deg,#563c2b33,transparent 45%);pointer-events:none}.fighterbox{position:absolute;bottom:15px;width:210px;text-align:center;transform:translateX(-50%);transition:left .2s}.fighterbox.left{left:18%}.fighterbox.right{left:82%}.fighter-art{transition:filter .15s,transform .15s}.fighterbox.hit .fighter-art{animation:impact .28s;filter:brightness(1.7) drop-shadow(0 0 14px #fff)}.fighterbox.attacking .fighter-art{animation:lunge .24s}.fighterbox.left.attacking .fighter-art{transform:translateX(20px) scale(1.04)}.fighterbox.right.attacking .fighter-art{transform:translateX(-20px) scale(1.04)}@keyframes impact{25%{transform:translateX(-12px) rotate(-4deg)}75%{transform:translateX(12px) rotate(4deg)}}@keyframes lunge{50%{translate:0 -10px}}.fightername{font-weight:900;text-shadow:0 2px 4px #000;margin-top:-3px}.health{height:14px;margin-top:8px;border:1px solid #ffffff77;border-radius:20px;background:#0007;overflow:hidden}.health i{display:block;height:100%;width:100%;background:var(--green);transition:width .25s}.enemyhealth i{background:var(--red)}.keyguide{text-align:center;color:#e3edf8;font-size:13px;padding:12px 8px 2px}.keyguide kbd{display:inline-block;background:#ffffff18;border:1px solid #ffffff35;border-radius:5px;padding:3px 7px;margin:0 2px;font:700 12px monospace}.log{height:90px;overflow:auto;margin-top:10px;border-radius:8px;background:#07111f;padding:9px;font-size:13px}.log div{padding:3px}.result{position:absolute;inset:0;display:none;place-items:center;background:#07111fe8;text-align:center}.result.show{display:grid}.result h1{font-size:42px;margin:0 0 8px;color:var(--gold)}.result p{margin:0 0 16px}.toast{position:fixed;right:20px;bottom:20px;padding:13px 18px;background:#fff;color:#17253a;border-radius:8px;opacity:0;transform:translateY(30px);transition:.25s}.toast.show{opacity:1;transform:none}@media(max-width:850px){.battle-grid{grid-template-columns:1fr}.fighters{grid-template-columns:repeat(2,1fr)}.fighterbox{width:180px}.stage{height:350px}}@media(max-width:500px){.shell{padding:14px}.fighters{grid-template-columns:1fr}.fighterbox{width:43%}.stage{height:300px}.fightername{font-size:12px}.keyguide{font-size:11px}.arenabox{padding:12px}}
</style>
</head>
<body>
<div class="shell"><header class="top"><div class="brand">GRAND LINE <b>ARENA</b></div><div class="berries">Berries <b id="berries">10,000</b></div></header>
<main class="battle-grid"><section><h1 class="title">Choose exactly two fighters</h1><div id="fighters" class="fighters"></div></section><aside class="side"><h2>Faction</h2><select id="faction"><option>Pirates</option><option>Marines</option><option>Revolutionaries</option></select><p class="enemy" id="enemy">Enemy faction: Marines</p><button id="start" class="start" disabled>START BATTLE</button></aside></main></div>
<div id="arena" class="arena"><div class="arenabox"><div class="arenahead"><h2>Battle Arena</h2><button id="close">Close</button></div><div class="stage">
<div id="leftBox" class="fighterbox left"><div id="leftArt"></div><div id="leftName" class="fightername"></div><div class="health"><i id="leftHealth"></i></div></div>
<div id="rightBox" class="fighterbox right"><div id="rightArt"></div><div id="rightName" class="fightername">Marine Captain</div><div class="health enemyhealth"><i id="rightHealth"></i></div></div>
<div id="result" class="result"><div><h1 id="resultTitle">VICTORY</h1><p id="resultText"></p><button id="again" class="start" style="width:auto;padding-inline:24px">FIGHT AGAIN</button></div></div>
</div><div class="keyguide"><kbd>A</kbd>/<kbd>D</kbd> or <kbd>←</kbd>/<kbd>→</kbd> Move &nbsp;·&nbsp; <kbd>Space</kbd> Attack &nbsp;·&nbsp; <kbd>Shift</kbd> Special &nbsp;·&nbsp; <kbd>E</kbd> Defend</div><div id="log" class="log"></div></div></div><div id="toast" class="toast"></div>
<script>
// Original, lightweight vector portraits use each character's recognizable colors, clothing, hair, and signature accessories; no external image service or hot-linked artwork is required.
const chars=[
 {name:'Monkey D. Luffy',role:'Rubber',skin:'#e6a77d',hair:'#171515',shirt:'#bd302d',pants:'#31569a',detail:'hat'},
 {name:'Roronoa Zoro',role:'Swordsman',skin:'#e8b99a',hair:'#438d51',shirt:'#d6d7ce',pants:'#38504a',detail:'swords'},
 {name:'Nami',role:'Navigator',skin:'#edbd99',hair:'#e88725',shirt:'#278dba',pants:'#244d79',detail:'staff'},
 {name:'Sanji',role:'Cook',skin:'#edc3a0',hair:'#efc84d',shirt:'#f2d959',pants:'#202533',detail:'suit'},
 {name:'Sabo',role:'Revolutionary',skin:'#e8b495',hair:'#e0bd79',shirt:'#315886',pants:'#26334a',detail:'topHat'},
 {name:'Smoker',role:'Marine',skin:'#e3b99d',hair:'#e3e3da',shirt:'#e9e9df',pants:'#48545e',detail:'cigars'},
 {name:'Nico Robin',role:'Archaeologist',skin:'#e8bea5',hair:'#211d2a',shirt:'#644c89',pants:'#292c48',detail:'sunglasses'},
 {name:'Franky',role:'Shipwright',skin:'#e8b18b',hair:'#278eb6',shirt:'#d94249',pants:'#235b8c',detail:'cyborg'},
 {name:'Portgas D. Ace',role:'Pirate',skin:'#eab48e',hair:'#33251f',shirt:'#41352d',pants:'#303744',detail:'orangeHat'}
];
let selected=[],berries=10000,battleActive=false,hp=100,enemy=100,defending=false,specialReady=true,playerX=18,enemyX=82;
const grid=document.querySelector('#fighters'),arena=document.querySelector('#arena'),log=document.querySelector('#log');
function art(c){const skin=c.skin,hair=c.hair,shirt=c.shirt,pants=c.pants;let accessory='';switch(c.detail){case'hat':accessory=`<ellipse cx="80" cy="41" rx="41" ry="8" fill="#d5a636"/><path d="M53 39q1-22 27-22t27 22z" fill="#d5a636"/><path d="M55 34h50" stroke="#9b4524" stroke-width="5"/>`;break;case'swords':accessory=`<path d="M36 93l-19 78M43 96l-7 81M112 96l20 75" stroke="#cfd9dd" stroke-width="5"/><path d="M12 169l15 4M30 173l15 4M126 169l15 4" stroke="#b88a40" stroke-width="5"/><path d="M59 109h42l-4 30H63z" fill="#4e8d55"/>`;break;case'staff':accessory=`<path d="M132 57l-7 119" stroke="#8a5a32" stroke-width="7"/><circle cx="131" cy="55" r="10" fill="#e9c34d"/><path d="M45 73q-15 25-12 57l13 9 10-53z" fill="#e88725"/>`;break;case'suit':accessory=`<path d="M61 70l19 15 18-15-8 71H68z" fill="#202533"/><path d="M77 84h7l-2 14h-5z" fill="#f2d959"/><path d="M97 39q17 0 10 14" fill="none" stroke="#6e4628" stroke-width="3"/>`;break;case'topHat':accessory=`<path d="M49 32h62l-8 8H56z" fill="#202630"/><path d="M60 2h41l7 31H54z" fill="#242936"/><rect x="58" y="23" width="48" height="6" fill="#94633f"/><circle cx="70" cy="13" r="5" fill="none" stroke="#a9b5b4" stroke-width="3"/><circle cx="86" cy="13" r="5" fill="none" stroke="#a9b5b4" stroke-width="3"/>`;break;case'cigars':accessory=`<path d="M48 54l13 5M87 54l15 5" stroke="#eee6d4" stroke-width="4"/><path d="M54 55l-5-7m43 9 5-7" stroke="#fff" stroke-width="2"/><path d="M42 70l-15 24 12 7 19-25M104 72l18 22-12 8-20-24" fill="#e8e9df" stroke="#bac2c3" stroke-width="4"/>`;break;case'sunglasses':accessory=`<path d="M54 46h24m8 0h24" stroke="#222" stroke-width="4"/><rect x="53" y="43" width="25" height="13" rx="5" fill="#222c" stroke="#171923" stroke-width="3"/><rect x="84" y="43" width="25" height="13" rx="5" fill="#222c" stroke="#171923" stroke-width="3"/>`;break;case'cyborg':accessory=`<path d="M29 80h28v48H29zM103 80h28v48h-28z" fill="#aebac1" stroke="#384b57" stroke-width="4"/><path d="M34 88h18M108 88h18" stroke="#e9d45d" stroke-width="5"/><path d="M39 101l8 6-8 6m82-12-8 6 8 6" fill="none" stroke="#344b58" stroke-width="3"/><path d="M32 84l10-7 10 7-10 7zM108 84l10-7 10 7-10 7z" fill="#e7dd5a"/>`;break;case'orangeHat':accessory=`<ellipse cx="80" cy="38" rx="39" ry="8" fill="#e77b27"/><path d="M54 36q2-22 26-22t26 22z" fill="#ef8d30"/><path d="M61 24h38" stroke="#438db2" stroke-width="4"/><circle cx="63" cy="25" r="5" fill="#f3dc98"/><circle cx="98" cy="25" r="5" fill="#f3dc98"/>`;break;}
let hairShape=c.detail==='topHat'?`<path d="M49 50q2-28 31-27 28 1 32 27l-7 5H55z" fill="${hair}"/>`:c.detail==='orangeHat'?`<path d="M51 51q2-28 29-28 26 0 30 28l-8 8H57z" fill="${hair}"/>`:c.detail==='sunglasses'?`<path d="M49 47q0-30 31-30 30 0 32 31l-8 12H56z" fill="${hair}"/>`:c.detail==='cigars'?`<path d="M49 45q0-28 31-29 31 1 32 30l-8 11H57z" fill="${hair}"/>`:c.detail==='suit'?`<path d="M48 47q2-30 32-30t32 30l-14 8H56z" fill="${hair}"/><path d="M83 31q19 1 22 17" fill="none" stroke="#d8ad3d" stroke-width="6"/>`:c.detail==='swords'?`<path d="M49 52q-9-24 9-32l-2 14q13-19 30-15 19 3 26 27l-11 13H57z" fill="${hair}"/>`:c.detail==='cyborg'?`<path d="M49 50q0-30 31-31 31 1 32 31l-12 8H59z" fill="${hair}"/>`:c.detail==='staff'?`<path d="M47 54q-4-31 28-38 30-3 40 30l-10 19-10-18-11 16-8-18-17 20z" fill="${hair}"/>`:`<path d="M48 52q0-34 32-35 33 0 33 36l-9 12H56z" fill="${hair}"/>`;
return `<svg class="fighter-art" viewBox="0 0 160 190" role="img" aria-label="Stylized ${c.name} portrait" xmlns="http://www.w3.org/2000/svg"><ellipse cx="80" cy="181" rx="42" ry="6" fill="#10202b" opacity=".55"/><path d="M42 178l4-51q4-23 34-23t34 23l4 51z" fill="${pants}"/><path d="M46 125q3-24 34-24t34 24l8 34H38z" fill="${shirt}" stroke="#152131" stroke-width="3"/><path d="M74 98h13v23l-7 10-7-10z" fill="${skin}"/><ellipse cx="80" cy="59" rx="30" ry="35" fill="${skin}" stroke="#55382d" stroke-width="2"/><path d="M55 59q8-6 15 0m20 0q7-6 14 0" fill="none" stroke="#302521" stroke-width="3"/><circle cx="68" cy="60" r="2.5" fill="#171717"/><circle cx="94" cy="60" r="2.5" fill="#171717"/><path d="M73 77q7 6 14 0" fill="none" stroke="#8d443a" stroke-width="2.5"/>${hairShape}${accessory}<path d="M48 128l-9 35m73-35 9 35" stroke="${skin}" stroke-width="11" stroke-linecap="round"/><path d="M51 171h22m16 0h22" stroke="#191e29" stroke-width="8" stroke-linecap="round"/><path d="M64 130h32" stroke="#ffffff30" stroke-width="3"/></svg>`}
function renderArt(id,target){target.innerHTML=art(chars[id])}
chars.forEach((c,i)=>{const card=document.createElement('article');card.className='fighter';card.innerHTML=`<div class="portrait" style="background:linear-gradient(145deg,${c.shirt},${c.pants})">${art(c)}</div><div class="info"><h3>${c.name}</h3><span class="role">${c.role}</span></div>`;card.onclick=()=>toggle(card,i);grid.appendChild(card)});
function toggle(card,i){if(selected.includes(i)){selected=selected.filter(x=>x!==i);card.classList.remove('selected')}else if(selected.length<2){selected.push(i);card.classList.add('selected')}else return toast('Choose exactly two fighters');document.querySelector('#start').disabled=selected.length!==2}
function toast(t){const el=document.querySelector('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}
function add(text){const line=document.createElement('div');line.textContent=text;log.appendChild(line);log.scrollTop=log.scrollHeight}
function setHealth(){document.querySelector('#leftHealth').style.width=Math.max(0,hp)+'%';document.querySelector('#rightHealth').style.width=Math.max(0,enemy)+'%'}
function animate(box,className){box.classList.remove('hit','attacking');void box.offsetWidth;box.classList.add(className);setTimeout(()=>box.classList.remove(className),320)}
function setPositions(){document.querySelector('#leftBox').style.left=playerX+'%';document.querySelector('#rightBox').style.left=enemyX+'%'}
function finish(won){if(!battleActive)return;battleActive=false;document.querySelector('#result').classList.add('show');document.querySelector('#resultTitle').textContent=won?'VICTORY':'DEFEAT';if(won){berries+=1500;document.querySelector('#berries').textContent=berries.toLocaleString();document.querySelector('#resultText').textContent='You earned 1,500 berries!'}else document.querySelector('#resultText').textContent='Regroup and try another strategy.'}
function enemyTurn(){if(!battleActive)return;const distance=enemyX-playerX;if(distance>22){enemyX=Math.max(playerX+18,enemyX-7);setPositions();add('The enemy closes in!');return}const damage=defending?Math.floor(Math.random()*5)+2:Math.floor(Math.random()*10)+6;hp=Math.max(0,hp-damage);defending=false;add('Enemy counterattacks for '+damage+' damage!');animate(document.querySelector('#leftBox'),'hit');setHealth();if(hp<=0)finish(false)}
function playerAttack(isSpecial=false){if(!battleActive)return;if(enemyX-playerX>24){add('Too far away! Move closer before attacking.');enemyTurn();return}if(isSpecial&&!specialReady){toast('Special move is recharging');return}const damage=Math.floor(Math.random()*(isSpecial?12:9))+(isSpecial?22:12);enemy=Math.max(0,enemy-damage);add((isSpecial?'SPECIAL MOVE! ':'Attack! ')+chars[selected[0]].name+' deals '+damage+' damage.');animate(document.querySelector('#leftBox'),'attacking');animate(document.querySelector('#rightBox'),'hit');setHealth();if(isSpecial){specialReady=false;setTimeout(()=>specialReady=true,3000)}if(enemy<=0)finish(true);else enemyTurn()}
function defend(){if(!battleActive)return;defending=true;add('You brace for impact; the next hit is reduced.');enemyTurn()}
function movePlayer(direction){if(!battleActive)return;playerX=Math.max(8,Math.min(72,playerX+direction*5));setPositions();if(Math.abs(enemyX-playerX)<=24)add('You are in range — press Space to attack!');else add(direction>0?'You advance toward the enemy.':'You step back.');enemyTurn()}
function startBattle(){if(selected.length!==2)return;const f=document.querySelector('#faction').value;renderArt(selected[0],document.querySelector('#leftArt'));document.querySelector('#leftName').textContent=chars[selected[0]].name+' + '+chars[selected[1]].name;let opponent=f==='Marines'?5:f==='Pirates'?0:4;renderArt(opponent,document.querySelector('#rightArt'));document.querySelector('#rightName').textContent=f==='Pirates'?'Marine Captain':f==='Marines'?'Pirate Captain':'World Government Agent';hp=enemy=100;playerX=18;enemyX=82;defending=false;specialReady=true;battleActive=true;setPositions();setHealth();log.innerHTML='';document.querySelector('#result').classList.remove('show');add('Battle started! Move with A/D or arrow keys.');arena.classList.add('open')}
document.querySelector('#faction').onchange=e=>{const enemies={Pirates:'Marines',Marines:'Pirates',Revolutionaries:'World Government'};document.querySelector('#enemy').textContent='Enemy faction: '+enemies[e.target.value]};document.querySelector('#start').onclick=startBattle;document.querySelector('#again').onclick=startBattle;document.querySelector('#close').onclick=()=>{battleActive=false;arena.classList.remove('open')};
document.addEventListener('keydown',e=>{if(!battleActive)return;const key=e.key.toLowerCase();if([' ','arrowleft','arrowright'].includes(key))e.preventDefault();if(key==='a'||key==='arrowleft')movePlayer(-1);else if(key==='d'||key==='arrowright')movePlayer(1);else if(key===' '&&!e.repeat)playerAttack();else if(key==='e'&&!e.repeat)defend();else if(key==='shift'&&!e.repeat)playerAttack(true)});
</script>
</body>
</html>
