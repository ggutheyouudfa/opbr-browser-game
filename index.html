<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grand Line Arena</title>
<style>
:root{--navy:#071426;--panel:#102a48;--gold:#f7c84b;--cyan:#75d6e8;--red:#ed6c79;--green:#67c88c}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#fff;font-family:Trebuchet MS,Arial,sans-serif;background:radial-gradient(circle at 50% -20%,#1b5277,#0c2341 36%,#071426 100%)}
button{font:inherit}.shell{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-size:24px;font-weight:900}.brand b{color:var(--gold)}
.berries{border:1px solid #ffffff22;border-radius:999px;background:#07142680;padding:9px 14px}.battle-grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px}.title{font-size:28px;margin:4px 0 18px}.fighters{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.fighter{height:220px;border:1px solid #ffffff18;border-radius:13px;overflow:hidden;background:#102845;cursor:pointer;transition:.18s}.fighter:hover{transform:translateY(-4px);border-color:#ffffff55}.fighter.selected{outline:3px solid var(--gold);outline-offset:-3px}.portrait{height:154px;display:grid;place-items:center;position:relative}.avatar{font-size:68px;filter:drop-shadow(0 12px 8px #0009)}.lock{position:absolute;left:12px;bottom:8px;font-size:10px;font-weight:900;color:#dce8f7}.info{height:66px;padding:11px 14px;background:#17304f}.info h3{font-size:17px;margin:0 0 5px}.role{color:var(--gold);font-size:12px}.side{height:max-content;border:1px solid #ffffff16;border-radius:13px;background:#102542;padding:18px}.side h2{margin:0 0 13px}.side select{width:100%;padding:12px;border:0;border-radius:8px}.enemy{color:#b6c5d8}.start{width:100%;border:0;border-radius:8px;padding:13px;background:var(--gold);color:#18243a;font-weight:900;cursor:pointer}.start:disabled{background:#4b5d72;color:#98a6b5}
.arena{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:#06101cdd;padding:20px}.arena.open{display:flex}.arenabox{width:min(900px,100%);background:#0c1c31;border:1px solid #ffffff22;border-radius:14px;padding:16px}.arenahead{display:flex;justify-content:space-between;align-items:center}.arenahead h2{margin:0}.arenahead button{border:1px solid #ffffff22;background:#ffffff10;color:#fff;padding:8px 12px;border-radius:8px;cursor:pointer}.stage{height:330px;position:relative;overflow:hidden;border-radius:12px;background:linear-gradient(#68bed1 0 58%,#b89961 59%)}.fighterbox{position:absolute;bottom:24px;width:260px;text-align:center}.fighterbox.left{left:4%}.fighterbox.right{right:4%}.fighteremoji{font-size:100px;transition:.12s}.fighteremoji.hit{transform:translateX(-18px) rotate(-8deg);filter:brightness(1.8)}.right .fighteremoji.hit{transform:translateX(18px) rotate(8deg)}.fighterbox.hit .fighteremoji{animation:shake .25s}@keyframes shake{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}.fightername{font-weight:900;text-shadow:0 2px #000}.health{height:14px;margin-top:8px;border:1px solid #ffffff55;border-radius:20px;background:#0007;overflow:hidden}.health i{display:block;height:100%;width:100%;background:var(--green);transition:.25s}.enemyhealth i{background:var(--red)}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.controls button{border:1px solid #ffffff25;border-radius:9px;padding:12px 8px;background:#17304f;color:#fff;font-weight:900;cursor:pointer}.controls button:hover{border-color:var(--gold)}.controls button:disabled{opacity:.45;cursor:not-allowed}.controls .special{background:#71303d}.log{height:100px;overflow:auto;margin-top:12px;border-radius:8px;background:#07111f;padding:9px;font-size:13px}.log div{padding:3px}.result{position:absolute;inset:0;display:none;place-items:center;background:#07111fe8;text-align:center}.result.show{display:grid}.result h1{font-size:42px;margin:0 0 8px;color:var(--gold)}.result p{margin:0 0 16px}.toast{position:fixed;right:20px;bottom:20px;padding:13px 18px;background:#fff;color:#17253a;border-radius:8px;opacity:0;transform:translateY(30px);transition:.25s}.toast.show{opacity:1;transform:none}@media(max-width:850px){.battle-grid{grid-template-columns:1fr}.fighters{grid-template-columns:repeat(2,1fr)}.side{position:static}.fighterbox{width:38%}.fighteremoji{font-size:72px}.stage{height:280px}}@media(max-width:500px){.shell{padding:14px}.fighters{grid-template-columns:1fr}.controls{grid-template-columns:1fr 1fr}.fighteremoji{font-size:58px}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><div class="brand">GRAND LINE <b>ARENA</b></div><div class="berries">Berries <b id="berries">10,000</b></div></header>
<main class="battle-grid">
<section><h1 class="title">Choose exactly two fighters</h1><div id="fighters" class="fighters"></div></section>
<aside class="side"><h2>Faction</h2><select id="faction"><option>Pirates</option><option>Marines</option><option>Revolutionaries</option></select><p class="enemy" id="enemy">Enemy faction: Marines</p><button id="start" class="start" disabled>START BATTLE</button></aside>
</main>
</div>
<div id="arena" class="arena"><div class="arenabox"><div class="arenahead"><h2>Battle Arena</h2><button id="close">Close</button></div>
<div class="stage">
<div id="leftBox" class="fighterbox left"><div id="leftEmoji" class="fighteremoji">🏴‍☠️</div><div id="leftName" class="fightername"></div><div class="health"><i id="leftHealth"></i></div></div>
<div id="rightBox" class="fighterbox right"><div id="rightEmoji" class="fighteremoji">⚔️</div><div id="rightName" class="fightername">Marine Captain</div><div class="health enemyhealth"><i id="rightHealth"></i></div></div>
<div id="result" class="result"><div><h1 id="resultTitle">VICTORY</h1><p id="resultText"></p><button id="again" class="start" style="width:auto;padding-inline:24px">FIGHT AGAIN</button></div></div>
</div>
<div class="controls"><button id="attack">⚔️ Attack</button><button id="defend">🛡️ Defend</button><button id="special" class="special">🔥 Special</button></div>
<div id="log" class="log"></div></div></div>
<div id="toast" class="toast"></div>
<script>
const chars=[['Monkey D. Luffy','🏴‍☠️','Rubber','#71303d','#dc4d5a'],['Roronoa Zoro','⚔️','Swordsman','#153c43','#1e8b86'],['Nami','🧭','Navigator','#594b6c','#d8a04a'],['Sanji','👞','Cook','#6f4b3b','#d0a46c'],['Sabo','🔥','Revolutionary','#70412a','#dc6540'],['Smoker','🚬','Marine','#56645f','#abb2a5'],['Nico Robin','🌸','Archaeologist','#4c3b70','#a178ba'],['Franky','🤖','Shipwright','#245c70','#49a1a5'],['Portgas D. Ace','🔥','Pirate','#733129','#ed8c3d']];
let selected=[],berries=10000,battleActive=false,hp=100,enemy=100,defending=false,specialReady=true,battleTimer=null;
const grid=document.querySelector('#fighters'),arena=document.querySelector('#arena'),log=document.querySelector('#log');
chars.forEach((c,i)=>{const card=document.createElement('article');card.className='fighter';card.innerHTML=`<div class="portrait" style="background:linear-gradient(145deg,${c[3]},${c[4]})"><div class="avatar">${c[1]}</div><span class="lock">ALL UNLOCKED</span></div><div class="info"><h3>${c[0]}</h3><span class="role">${c[2]}</span></div>`;card.onclick=()=>toggle(card,i);grid.appendChild(card)});
function toggle(card,i){if(selected.includes(i)){selected=selected.filter(x=>x!==i);card.classList.remove('selected')}else if(selected.length<2){selected.push(i);card.classList.add('selected')}else return toast('Choose exactly two fighters');document.querySelector('#start').disabled=selected.length!==2}
function toast(t){const el=document.querySelector('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}
function add(text){log.insertAdjacentHTML('beforeend','<div>'+text+'</div>');log.scrollTop=log.scrollHeight}
function setHealth(){document.querySelector('#leftHealth').style.width=Math.max(0,hp)+'%';document.querySelector('#rightHealth').style.width=Math.max(0,enemy)+'%'}
function hit(box){box.classList.remove('hit');void box.offsetWidth;box.classList.add('hit');setTimeout(()=>box.classList.remove('hit'),300)}
function finish(won){battleActive=false;clearInterval(battleTimer);document.querySelectorAll('.controls button').forEach(b=>b.disabled=true);const result=document.querySelector('#result');result.classList.add('show');document.querySelector('#resultTitle').textContent=won?'VICTORY':'DEFEAT';if(won){berries+=1500;document.querySelector('#berries').textContent=berries.toLocaleString();document.querySelector('#resultText').textContent='You earned 1,500 berries!'}else document.querySelector('#resultText').textContent='Regroup and try another strategy.'}
function enemyTurn(){if(!battleActive)return;const damage=defending?Math.floor(Math.random()*6)+3:Math.floor(Math.random()*13)+7;hp=Math.max(0,hp-damage);defending=false;add('Enemy counterattacks for '+damage+' damage!');hit(document.querySelector('#leftBox'));setHealth();if(hp<=0)finish(false)}
function startBattle(){const a=chars[selected[0]],b=chars[selected[1]],f=document.querySelector('#faction').value;document.querySelector('#leftEmoji').textContent=a[1];document.querySelector('#leftName').textContent=a[0]+' + '+b[0];document.querySelector('#rightEmoji').textContent=f==='Marines'?'🏴‍☠️':'⚔️';document.querySelector('#rightName').textContent=f==='Pirates'?'Marine Captain':f==='Marines'?'Pirate Captain':'Government Agent';hp=100;enemy=100;defending=false;specialReady=true;battleActive=true;setHealth();log.innerHTML='';document.querySelector('#result').classList.remove('show');document.querySelectorAll('.controls button').forEach(b=>b.disabled=false);add('The battle begins!');arena.classList.add('open')}
document.querySelector('#faction').onchange=e=>{const enemies={Pirates:'Marines',Marines:'Pirates',Revolutionaries:'World Government'};document.querySelector('#enemy').textContent='Enemy faction: '+enemies[e.target.value]};
document.querySelector('#start').onclick=startBattle;document.querySelector('#close').onclick=()=>{battleActive=false;clearInterval(battleTimer);arena.classList.remove('open')};
document.querySelector('#again').onclick=startBattle;
document.querySelector('#attack').onclick=()=>{if(!battleActive)return;const damage=Math.floor(Math.random()*13)+9;enemy=Math.max(0,enemy-damage);add(chars[selected[Math.floor(Math.random()*2)]][0]+' attacks for '+damage+' damage!');hit(document.querySelector('#rightBox'));setHealth();if(enemy<=0)finish(true);else enemyTurn()};
document.querySelector('#defend').onclick=()=>{if(!battleActive)return;defending=true;add('You brace for impact — next damage is reduced!');enemyTurn()};
document.querySelector('#special').onclick=()=>{if(!battleActive)return;if(!specialReady)return toast('Special move is recharging');const damage=Math.floor(Math.random()*20)+22;enemy=Math.max(0,enemy-damage);specialReady=false;document.querySelector('#special').disabled=true;add('SPECIAL MOVE! '+chars[selected[0]][0]+' deals '+damage+' damage!');hit(document.querySelector('#rightBox'));setHealth();if(enemy<=0)finish(true);else{enemyTurn();setTimeout(()=>{if(battleActive){specialReady=true;document.querySelector('#special').disabled=false}},2500)}};
</script>
</body>
</html>
