<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grand Line: Crew Conquest</title>
<style>
:root{--ink:#071425;--panel:#101f36;--panel2:#172942;--gold:#f4c44e;--blue:#62c4da;--red:#ef5a67}
*{box-sizing:border-box}body{margin:0;color:#f7fbff;background:radial-gradient(circle at 8% 10%,#14325a 0,#09182c 38%,#07111f 100%);font-family:Inter,Segoe UI,system-ui,sans-serif;min-height:100vh}button,select,input{font:inherit}.shell{max-width:1180px;margin:auto;padding:28px 24px 50px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.brand{font-weight:900;font-size:22px;letter-spacing:.5px}.brand span{color:var(--gold)}.wallet{display:flex;gap:10px}.chip{background:#ffffff10;border:1px solid #ffffff17;border-radius:999px;padding:8px 13px;font-size:13px}.nav{display:flex;gap:8px;margin-bottom:22px}.nav button{border:1px solid #ffffff18;border-radius:999px;color:#dfe9f7;background:#ffffff08;padding:10px 20px;cursor:pointer}.nav button.active{background:var(--gold);border-color:var(--gold);color:#172033;font-weight:800}.view{display:none}.view.active{display:grid}.battle-layout{grid-template-columns:minmax(0,1fr) 270px;gap:24px}.title{font-size:25px;margin:4px 0 18px}.fighters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.fighter-card{position:relative;height:235px;border:1px solid #ffffff12;border-radius:14px;overflow:hidden;background:linear-gradient(145deg,#172a48,#0d1b31);cursor:pointer;transition:.18s}.fighter-card:hover{transform:translateY(-3px);border-color:#ffffff35}.fighter-card.selected{border:2px solid var(--gold);box-shadow:0 10px 28px #f4c44e25}.art{height:145px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(160deg,#214260,#4d1d39)}.art:before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:#ffffff10;left:-28px;bottom:-80px}.emoji{font-size:82px;filter:drop-shadow(0 12px 8px #0008);z-index:1}.status{position:absolute;left:12px;bottom:10px;font-size:11px;font-weight:900;color:#8ea1bb}.card-info{padding:12px 14px}.card-info h3{margin:0 0 5px;font-size:17px}.role{color:var(--gold);font-size:13px}.side{background:#101e34;border:1px solid #ffffff12;border-radius:14px;padding:20px;height:max-content}.side h2{margin:0 0 14px;font-size:20px}.side select{width:100%;padding:12px;border-radius:8px;border:1px solid #b7c0ce;background:#fff;color:#172033}.enemy{color:#9cb0c8;font-size:13px;min-height:40px;margin:14px 0}.battle-btn{width:100%;border:0;border-radius:9px;padding:13px;background:var(--gold);color:#172033;font-weight:900;cursor:pointer}.battle-btn:disabled{background:#3b4a60;color:#7d8aa0;cursor:not-allowed}.crew-panel,.explore-panel{grid-template-columns:1fr}.crew-form{display:flex;gap:10px;background:#101e34;border:1px solid #ffffff12;border-radius:14px;padding:18px}.crew-form input{flex:1;padding:12px;border:1px solid #ffffff20;border-radius:8px;background:#081426;color:#fff}.crew-form button{border:0;border-radius:8px;padding:12px 18px;background:var(--gold);font-weight:800}.crew-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}.crew-card{border:1px solid #ffffff12;border-radius:12px;background:#101e34;padding:18px;text-align:center}.crew-card b{display:block;margin-top:8px}.map{height:420px;border-radius:16px;border:1px solid #ffffff18;overflow:hidden;position:relative;background:linear-gradient(#79c5d8 0 52%,#27849e 53%)}.island{position:absolute;border-radius:52%;background:#deb96f;border:7px solid #73995d;box-shadow:0 12px 20px #0005}.island span{position:absolute;color:#173b49;font-weight:900;font-size:12px;white-space:nowrap}.is1{width:180px;height:110px;left:7%;top:39%}.is1 span{left:42px;top:42px}.is2{width:220px;height:135px;right:7%;top:20%}.is2 span{left:65px;top:52px}.is3{width:150px;height:92px;left:43%;bottom:7%}.is3 span{left:44px;top:34px}.ship{position:absolute;font-size:72px;left:44%;top:48%;transition:.8s;filter:drop-shadow(0 10px 6px #0006);z-index:2}.explore-tools{display:flex;justify-content:space-between;margin-bottom:14px}.toast{position:fixed;right:24px;bottom:24px;padding:14px 18px;background:#fff;color:#172033;border-radius:9px;transform:translateY(100px);transition:.25s;box-shadow:0 12px 30px #0006}.toast.show{transform:none}.arena{position:fixed;inset:0;z-index:20;background:#07111feF;display:none;align-items:center;justify-content:center;padding:20px}.arena.open{display:flex}.arena-box{width:min(900px,100%);background:#0d1b30;border:1px solid #ffffff20;border-radius:16px;padding:18px}.arena-head{display:flex;justify-content:space-between;align-items:center}.arena-head button{border:1px solid #ffffff20;background:#ffffff10;color:#fff;border-radius:8px;padding:8px 12px}.stage{height:330px;border-radius:12px;position:relative;overflow:hidden;background:linear-gradient(#63bacf 0 58%,#b08a50 59%)}.combatant{position:absolute;bottom:30px;width:240px;text-align:center}.combatant.left{left:5%}.combatant.right{right:5%}.combatant .big{font-size:96px;filter:drop-shadow(0 12px 8px #0008)}.health{height:15px;margin-top:8px;background:#0008;border-radius:8px;border:1px solid #ffffff40;overflow:hidden}.health i{display:block;height:100%;background:#68d18a;transition:.3s}.combatant.right .health i{background:#ef6c79}.combatant-name{font-weight:900;margin-top:4px}.battle-log{height:110px;margin-top:12px;background:#07111f;border-radius:9px;padding:10px;overflow:auto;font-size:13px;color:#bfd0e6}.battle-log div{padding:3px 0}@media(max-width:800px){.battle-layout{grid-template-columns:1fr}.side{position:static}.fighters{grid-template-columns:repeat(2,1fr)}.crew-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.fighters{grid-template-columns:1fr}.fighter-card{height:220px}.combatant{width:150px}.combatant .big{font-size:65px}}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar"><div class="brand">GRAND LINE <span>CONQUEST</span></div><div class="wallet"><div class="chip">Berries <b id="berries">10,000</b></div><div class="chip">Crew <b id="crewCount">0</b></div></div></header>
  <nav class="nav"><button class="active" data-view="battle">Battle</button><button data-view="crew">Crew</button><button data-view="explore">Explore</button></nav>
  <main id="battle" class="view active battle-layout">
    <section><h1 class="title">Choose exactly two fighters</h1><div id="fighterGrid" class="fighters"></div></section>
    <aside class="side"><h2>Faction</h2><select id="faction"><option value="Pirates">Pirates</option><option value="Marines">Marines</option><option value="Revolutionaries">Revolutionaries</option></select><p id="enemy" class="enemy">Enemy faction: Marines</p><button id="startBattle" class="battle-btn" disabled>START BATTLE</button></aside>
  </main>
  <main id="crew" class="view crew-panel"><section><h1 class="title">Your Crew</h1><div class="crew-form"><input id="crewName" value="Straw Hat Fellowship"><input id="memberName" placeholder="New crew member name"><button id="addMember">Recruit</button></div><div id="crewGrid" class="crew-grid"></div></section></main>
  <main id="explore" class="view explore-panel"><section><h1 class="title">Sea Exploration</h1><div class="explore-tools"><div>Ship: <b id="shipName">Voyager</b></div><button id="unlockShip" class="battle-btn" style="width:auto">UNLOCK SHIP · 5,000</button></div><div class="map"><div class="island is1"><span>Loguetown</span></div><div class="island is2"><span>Drum Island</span></div><div class="island is3"><span>Marineford</span></div><div id="ship" class="ship">⛵</div></div></section></main>
</div>
<div id="arena" class="arena"><div class="arena-box"><div class="arena-head"><h2>Battle Simulation</h2><button id="closeArena">Close</button></div><div class="stage"><div class="combatant left"><div id="leftBig" class="big">🏴‍☠️</div><div id="leftName" class="combatant-name"></div><div class="health"><i id="leftHealth"></i></div></div><div class="combatant right"><div id="rightBig" class="big">⚔️</div><div id="rightName" class="combatant-name"></div><div class="health"><i id="rightHealth"></i></div></div></div><div id="battleLog" class="battle-log"></div></div></div>
<div id="toast" class="toast"></div>
<script>
const characters=[
['Monkey D. Luffy','🏴‍☠️','Rubber','linear-gradient(160deg,#2c4871,#84263c)'],['Roronoa Zoro','⚔️','Swordsman','linear-gradient(160deg,#1d5b50,#1a2f61)'],['Nami','🧭','Navigator','linear-gradient(160deg,#b75b35,#243c75)'],['Sanji','👞','Cook','linear-gradient(160deg,#315b83,#9a5a30)'],['Sabo','🔥','Revolutionary','linear-gradient(160deg,#60366d,#ba5135)'],['Smoker','🚬','Marine','linear-gradient(160deg,#56665e,#26354d)'],['Akainu','🌋','Marine Admiral','linear-gradient(160deg,#773023,#301a20)'],['Nico Robin','🌸','Archaeologist','linear-gradient(160deg,#493b79,#181e3c)'],['Franky','🤖','Shipwright','linear-gradient(160deg,#245e73,#4a245f)']];
let selected=[],berries=10000,crew=[];
const grid=document.querySelector('#fighterGrid');
characters.forEach((c,i)=>{const card=document.createElement('article');card.className='fighter-card';card.innerHTML=`<div class="art" style="background:${c[3]}"><span class="emoji">${c[1]}</span><span class="status">ALL UNLOCKED</span></div><div class="card-info"><h3>${c[0]}</h3><span class="role">${c[2]}</span></div>`;card.onclick=()=>{if(selected.includes(i)){selected=selected.filter(x=>x!==i);card.classList.remove('selected')}else if(selected.length<2){selected.push(i);card.classList.add('selected')}else{toast('Choose exactly two fighters')};document.querySelector('#startBattle').disabled=selected.length!==2};grid.appendChild(card)});
const views=document.querySelectorAll('.nav button');views.forEach(b=>b.onclick=()=>{views.forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.querySelector('#'+b.dataset.view).classList.add('active')});
const faction=document.querySelector('#faction');faction.onchange=()=>{const names={Pirates:'Marines',Marines:'Pirates',Revolutionaries:'World Government'};document.querySelector('#enemy').textContent='Enemy faction: '+names[faction.value]};
function toast(text){const t=document.querySelector('#toast');t.textContent=text;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
const arena=document.querySelector('#arena');document.querySelector('#closeArena').onclick=()=>{arena.classList.remove('open')};
document.querySelector('#startBattle').onclick=()=>{const a=characters[selected[0]],b=characters[selected[1]];document.querySelector('#leftName').textContent=a[0]+' + '+b[0];document.querySelector('#leftBig').textContent=a[1];document.querySelector('#leftHealth').style.width='100%';document.querySelector('#rightHealth').style.width='100%';const enemies=faction.value==='Marines'?['Monkey D. Luffy','Shanks','Buggy','Edward Newgate']:['Sengoku','Akainu','Smoker','Kizaru'];document.querySelector('#rightName').textContent=enemies[Math.floor(Math.random()*enemies.length)];document.querySelector('#rightBig').textContent=faction.value==='Marines'?'🏴‍☠️':'⚔️';document.querySelector('#battleLog').innerHTML='';arena.classList.add('open');simulate()};
function addLog(text){const log=document.querySelector('#battleLog');log.insertAdjacentHTML('beforeend','<div>'+text+'</div>');log.scrollTop=log.scrollHeight}
function simulate(){let team=100,enemy=100;addLog('The battle begins!');const timer=setInterval(()=>{if(enemy>0){const damage=12+Math.floor(Math.random()*20);enemy=Math.max(0,enemy-damage);document.querySelector('#rightHealth').style.width=enemy+'%';addLog(characters[selected[Math.random()<.5?0:1]][0]+' unleashed a '+['heavy strike','power combo','special attack','finisher'][Math.floor(Math.random()*4)]+'!')}if(team>0&&enemy>0){const damage=10+Math.floor(Math.random()*17);team=Math.max(0,team-damage);document.querySelector('#leftHealth').style.width=team+'%';addLog('The enemy counterattacked for '+damage+' damage!')}if(team<=0||enemy<=0){clearInterval(timer);if(enemy<=0){berries+=1500;document.querySelector('#berries').textContent=berries.toLocaleString();addLog('VICTORY! 1,500 berries earned.') }else addLog('Defeat — regroup and try again.')}},700)}
function renderCrew(){document.querySelector('#crewCount').textContent=crew.length;const grid=document.querySelector('#crewGrid');grid.innerHTML=crew.map((name,i)=>`<article class="crew-card"><div style="font-size:48px">🧑‍✈️</div><b>${name}</b><small>Crew member ${i+1}</small></article>`).join('')||'<p style="color:#91a3ba">No members recruited yet.</p>'}
document.querySelector('#addMember').onclick=()=>{const name=document.querySelector('#memberName').value.trim();if(!name)return toast('Enter a crew member name');crew.push(name);document.querySelector('#memberName').value='';renderCrew();toast(name+' joined the crew')};
document.querySelector('#unlockShip').onclick=()=>{if(berries<5000)return toast('Need 5,000 berries');berries-=5000;document.querySelector('#berries').textContent=berries.toLocaleString();document.querySelector('#shipName').textContent='Grand Voyager';toast('Ship unlocked: Grand Voyager')};
const ship=document.querySelector('#ship');document.querySelectorAll('.island').forEach((island,i)=>{island.onclick=()=>{ship.style.left=['15%','68%','43%'][i];ship.style.top=['44%','28%','55%'][i];toast(['Arrived at Loguetown','Arrived at Drum Island','Arrived at Marineford'][i])}});
renderCrew();
</script>
</body>
</html>
